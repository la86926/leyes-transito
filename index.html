<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="brand-row">
        <button class="brand" data-route="home" aria-label="Ir al inicio">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span><b>Ruta Perú</b><small>Conduce con criterio</small></span>
        </button>
        <button class="icon-button sidebar-collapse" id="collapseBtn" aria-label="Plegar menú">‹</button>
      </div>

      <div class="sidebar-foot">
        <div class="review-chip"><span class="status-dot"></span><span>Revisión legal</span><b>19 ago 2026</b></div>

          <button class="mini-action" data-route="sources">ⓘ <span>Fuentes</span></button>
        </div>
      </div>
    </aside>

    <div class="sidebar-scrim" id="scrim"></div>

    <main class="main-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="Buscar: casco, velocidad, estacionamiento…" autocomplete="off">
          <kbd>⌘ K</kbd>
          <div class="search-results" id="searchResults" hidden></div>
        </div>
        <button class="avatar-button" data-route="progress" aria-label="Ver progreso"><span id="topProgress">0%</span></button>
      </header>

      <section class="content" id="content" aria-live="polite"></section>
    </main>

    <nav class="mobile-tabs" aria-label="Navegación móvil">
      <button data-route="home"><span>⌂</span>Inicio</button>
      <button data-route="moto"><span>◉</span>Moto</button>
      <button data-route="cases"><span>◇</span>Casos</button>
      <button data-route="quiz"><span>✓</span>Práctica</button>
      <button id="moreBtn"><span>•••</span>Más</button>
    </nav>

    <div class="modal-backdrop" id="sourceModal" hidden>
      <article class="source-sheet" role="dialog" aria-modal="true" aria-labelledby="sourceTitle">
        <div class="source-sheet-head">
          <div><span class="eyebrow">Fuente integrada</span><h2 id="sourceTitle">Fuente</h2></div>

        </div>
        <div id="sourceBody"></div>
      </article>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
