<!doctype html>
<html lang="es" data-theme="system">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f5"><title>Ruta Perú · Normas de tránsito</title>
<style>
:root{--bg:#f5f7f5;--panel:rgba(255,255,255,.82);--card:#fff;--text:#17201c;--muted:#68736d;--line:#e5ebe7;--blue:#dfeefa;--blue2:#376b91;--green:#e2f3e8;--green2:#28734a;--amber:#fff0d6;--amber2:#8a5a12;--rose:#fbe4e7;--rose2:#9c4350;--shadow:0 12px 40px rgba(35,54,45,.07);--radius:22px}
@media(prefers-color-scheme:dark){html[data-theme="system"]{--bg:#111513;--panel:rgba(25,31,28,.88);--card:#1a211e;--text:#edf3ef;--muted:#9aa8a0;--line:#2b3530;--blue:#1b3444;--blue2:#9dcae8;--green:#183629;--green2:#8dd3a9;--amber:#3b301d;--amber2:#efc878;--rose:#402329;--rose2:#ef9ba7;--shadow:0 12px 40px rgba(0,0,0,.18)}}
html[data-theme="dark"]{--bg:#111513;--panel:rgba(25,31,28,.88);--card:#1a211e;--text:#edf3ef;--muted:#9aa8a0;--line:#2b3530;--blue:#1b3444;--blue2:#9dcae8;--green:#183629;--green2:#8dd3a9;--amber:#3b301d;--amber2:#efc878;--rose:#402329;--rose2:#ef9ba7;--shadow:0 12px 40px rgba(0,0,0,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:272px;padding:24px 16px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(24px);z-index:20;overflow:auto}.brand{display:flex;align-items:center;gap:11px;padding:0 9px 20px;font-weight:760;font-size:17px}.brandmark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,#dff0e6,#dfeefa);color:#315b48}.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:16px 11px 7px}.nav button{width:100%;border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:12px;margin:2px 0;display:flex;gap:10px;align-items:center}.nav button:hover{background:var(--card);color:var(--text)}.nav button.active{background:var(--card);color:var(--text);box-shadow:0 2px 12px rgba(30,50,40,.05);font-weight:650}.main{margin-left:272px;min-height:100vh}.topbar{height:72px;display:flex;align-items:center;gap:12px;padding:0 5vw;position:sticky;top:0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);z-index:10;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent)}.search{max-width:620px;flex:1;position:relative}.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:10px 14px 10px 38px;outline:0}.search span{position:absolute;left:13px;top:9px;color:var(--muted)}.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:13px;min-width:42px;height:42px}.menuBtn{display:none}.content{max-width:1120px;margin:auto;padding:44px 5vw 80px}.eyebrow{color:var(--green2);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.04;letter-spacing:-.04em;margin:8px 0 14px;max-width:800px}.hero p{font-size:17px;color:var(--muted);max-width:720px}.review{display:inline-flex;gap:8px;align-items:center;margin-top:10px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--muted);font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#55a474}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;margin-top:30px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.progress-card{grid-column:span 5}.continue-card{grid-column:span 7;background:linear-gradient(145deg,var(--card),var(--blue))}.stat{font-size:36px;font-weight:750;letter-spacing:-.04em}.muted{color:var(--muted)}.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;width:0;background:var(--green2);border-radius:inherit;transition:.5s}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:650;background:var(--text);color:var(--bg)}.btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--line)}.modules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}.module{padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:.2s;cursor:pointer}.module:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.module .emoji{font-size:26px}.module h3{margin:12px 0 5px}.module p{margin:0;color:var(--muted);font-size:13px}.tag{display:inline-flex;margin-top:13px;border-radius:999px;padding:5px 9px;background:var(--blue);color:var(--blue2);font-size:11px;font-weight:700}.lesson-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.lesson-head h1{font-size:38px;letter-spacing:-.03em;margin:6px 0}.back{border:0;background:transparent;color:var(--muted);padding:5px 0}.legal-card{margin:20px 0}.legal-card h3{margin:0 0 8px}.callout{padding:18px;border-radius:17px;margin:14px 0;border:1px solid transparent}.callout.info{background:var(--blue);color:var(--text)}.callout.practice{background:var(--green)}.callout.warn{background:var(--amber)}.callout.pending{background:var(--rose)}.callout b{display:block;margin-bottom:4px}.source-link{display:inline-flex;margin-top:9px;color:var(--blue2);text-decoration:none;font-weight:650}.quiz{margin-top:22px}.option{width:100%;text-align:left;padding:13px 15px;margin:7px 0;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text)}.option:hover{border-color:var(--blue2)}.option.correct{background:var(--green);border-color:var(--green2)}.option.wrong{background:var(--rose);border-color:var(--rose2)}.feedback{display:none;margin-top:12px;padding:15px;border-radius:14px;background:var(--blue)}.source-item{padding:18px 0;border-bottom:1px solid var(--line)}.source-item a{color:var(--blue2);font-weight:650;text-decoration:none}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--green);color:var(--green2);font-weight:700}.empty{padding:45px;text-align:center;color:var(--muted)}.mobile-overlay{display:none}
@media(max-width:820px){.sidebar{transform:translateX(-102%);transition:.25s;width:286px}.sidebar.open{transform:none}.main{margin-left:0}.menuBtn{display:block}.content{padding:30px 20px 80px}.topbar{padding:0 18px}.modules{grid-template-columns:1fr 1fr}.progress-card,.continue-card{grid-column:1/-1}.mobile-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:15}}
@media(max-width:520px){.modules{grid-template-columns:1fr}.hero h1{font-size:38px}.search input{font-size:16px}.lesson-head h1{font-size:31px}.content{padding-inline:16px}.card{padding:18px}.topbar{height:64px}}
</style>
</head><body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">↗</div>Ruta Perú</div><nav class="nav" id="nav"></nav></aside><div class="mobile-overlay" id="overlay"></div>
<main class="main"><header class="topbar"><button class="iconbtn menuBtn" id="menuBtn" aria-label="Menú">☰</button><div class="search"><span>⌕</span><input id="search" placeholder="Buscar norma, tema o concepto…" autocomplete="off"></div><button class="iconbtn" id="themeBtn" title="Tema">◐</button></header><section class="content" id="content"></section></main></div>
<script>
const SOURCES={
rnt:{title:'TUO del Reglamento Nacional de Tránsito – Código de Tránsito',norm:'D.S. N.° 016-2009-MTC',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/normas-legales/344452-016-2009-mtc'},
speed:{title:'Modificación de límites máximos de velocidad',norm:'D.S. N.° 025-2021-MTC',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/noticias/507197-mtc-modifica-los-limites-maximos-de-velocidad-en-zonas-urbanas'},
helmet:{title:'Especificaciones técnicas para cascos de motocicleta',norm:'R.D. N.° 0012-2025-MTC/18',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/normas-legales/6958752-0012-2025-mtc-18'},
helmetmod:{title:'Modificación de la R.D. N.° 0012-2025-MTC/18',norm:'R.D. N.° 018-2025-MTC/18',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/normas-legales/7077576-018-2025-mtc-18'},
signs:{title:'Manual de Dispositivos de Control de Tránsito Automotor',norm:'R.D. N.° 26-2024-MTC/18',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/normas-legales/6150395-26-2024-mtc-18'},
rnt2026a:{title:'Modificación del Reglamento Nacional de Tránsito',norm:'D.S. N.° 002-2026-MTC',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/normas-legales'},
rnt2026b:{title:'Modificación del Reglamento Nacional de Tránsito',norm:'D.S. N.° 011-2026-MTC',entity:'Ministerio de Transportes y Comunicaciones',url:'https://www.gob.pe/institucion/mtc/normas-legales/8042204-011-2026-mtc'}
};
const MODULES=[['home','🏠','Inicio'],['moto','🏍️','Motocicleta'],['auto','🚗','Automóvil'],['signs','🚦','Señales de tránsito'],['rules','🛣️','Reglas generales'],['infractions','⚠️','Infracciones'],['cases','🧠','Casos prácticos'],['quiz','📝','Evaluación'],['errors','⭐','Mis errores'],['favorites','🔖','Favoritos'],['sources','📚','Fuentes oficiales']];
const LESSONS={
moto:{title:'Motocicleta',intro:'Empieza por las reglas que más influyen en tu conducción diaria.',items:[
{id:'m-casco',title:'Casco: obligación y especificaciones',kind:'Norma vigente',body:'El uso del casco de seguridad alcanza al conductor y acompañante de motocicleta. Las especificaciones técnicas vigentes fueron aprobadas por la R.D. N.° 0012-2025-MTC/18, que derogó la R.D. N.° 008-2025-MTC/18.',practice:'Antes de salir, no basta con “llevar” el casco: úsalo correctamente y verifica que cumpla las especificaciones técnicas aplicables.',warning:'No uses como referencia una publicación antigua sobre la R.D. N.° 008-2025-MTC/18: fue derogada.',source:'helmet',q:{text:'¿Qué resolución aprobó las especificaciones técnicas de casco que sustituyeron a la R.D. N.° 008-2025-MTC/18?',opts:['R.D. N.° 0012-2025-MTC/18','R.D. N.° 26-2024-MTC/18','D.S. N.° 025-2021-MTC'],answer:0,why:'La R.D. N.° 0012-2025-MTC/18 derogó expresamente la R.D. N.° 008-2025-MTC/18.'}},
{id:'m-chaleco',title:'Chaleco: atención al ámbito de aplicación',kind:'Norma vigente · requiere lectura contextual',body:'La regulación del chaleco tuvo cambios durante 2025. La R.D. N.° 0012-2025-MTC/18 delimitó sus especificaciones y ámbito; posteriormente la R.D. N.° 018-2025-MTC/18 modificó parte de esa resolución.',practice:'Antes de asumir que una exigencia de chaleco difundida en redes se aplica igual en todo el país, comprueba el ámbito territorial y la norma más reciente.',warning:'Este minicurso no generaliza la obligación del chaleco a todo el Perú. El detalle territorial debe verificarse con las normas vigentes y el estado de emergencia aplicable.',source:'helmetmod'},
{id:'m-velocidad',title:'Velocidad urbana: calles y avenidas',kind:'Norma vigente',body:'El MTC modificó los límites máximos en zona urbana mediante el D.S. N.° 025-2021-MTC: 30 km/h en calles y jirones, y 50 km/h en avenidas.',practice:'Que una avenida esté despejada no eleva por sí sola el límite máximo. La señalización y las reglas específicas de la vía también deben respetarse.',warning:'No confundas “velocidad máxima” con una velocidad que siempre sea segura: lluvia, poca visibilidad o tráfico pueden exigir circular más despacio.',source:'speed',q:{text:'En una calle urbana, ¿cuál es el límite máximo general indicado por la modificación del MTC?',opts:['30 km/h','40 km/h','50 km/h'],answer:0,why:'El MTC fijó 30 km/h para calles y jirones; en avenidas, 50 km/h.'}}
]},
auto:{title:'Automóvil',intro:'Base preparada para estudiar automóvil sin mezclar reglas específicas de motocicleta.',items:[{id:'a-base',title:'Módulo en construcción verificada',kind:'Información pendiente de verificación en fuente oficial',body:'La arquitectura ya está lista. Las lecciones de licencia, documentación, cinturón, luces, estacionamiento y demás temas se incorporarán solo después de verificar cada regla y su vigencia.',source:'rnt'}]},
signs:{title:'Señales de tránsito',intro:'Las señales se estudiarán con el manual oficial actualizado.',items:[{id:'s-manual',title:'Manual oficial vigente de referencia',kind:'Norma vigente',body:'El MTC aprobó en 2024 la actualización del Manual de Dispositivos de Control de Tránsito Automotor mediante la R.D. N.° 26-2024-MTC/18 y derogó la versión aprobada en 2016. El manual incluye señales verticales, señales horizontales o marcas en el pavimento y otros dispositivos.',practice:'Para aprender una señal, estudia a la vez su forma, mensaje y conducta esperada; no solo memorices el dibujo.',source:'signs'}]},
rules:{title:'Reglas generales',intro:'Principios comunes para conducir con criterio y respaldo normativo.',items:[{id:'r-vel',title:'Límites urbanos básicos',kind:'Norma vigente',body:'Como punto de partida verificado: 30 km/h en calles y jirones y 50 km/h en avenidas, conforme a la modificación comunicada por el MTC.',source:'speed'}]},
infractions:{title:'Infracciones',intro:'Las sanciones cambian y se revisarán con especial cautela.',items:[{id:'i-policy',title:'Política de verificación de sanciones',kind:'Información pendiente de verificación en fuente oficial',body:'No se mostrarán montos, códigos ni puntos hasta contrastar el cuadro de infracciones vigente y sus modificaciones más recientes. Así se evita enseñar una sanción desactualizada.',source:'rnt'}]},
cases:{title:'Casos prácticos',intro:'Decide primero. Lee la explicación después.',items:[{id:'c-speed',title:'Una calle despejada',kind:'Caso práctico',body:'Circulas por una calle urbana sin señal que autorice una velocidad distinta. Hay poco tránsito. ¿El hecho de que esté despejada permite superar por sí solo 30 km/h?',source:'speed',q:{text:'¿Qué decisión es compatible con la regla general verificada?',opts:['Mantenerse dentro del máximo de 30 km/h','Subir a 50 km/h porque no hay tráfico','Elegir cualquier velocidad si la vía está vacía'],answer:0,why:'La ausencia de tráfico no modifica por sí sola el límite máximo general de una calle o jirón.'}}]},
quiz:{title:'Evaluación',intro:'Preguntas construidas únicamente con contenido ya verificado.',items:[]}
};
const state=JSON.parse(localStorage.getItem('rutaPeruState')||'{"done":[],"errors":[],"favorites":[],"last":"moto"}');
function save(){localStorage.setItem('rutaPeruState',JSON.stringify(state))}function nav(){document.getElementById('nav').innerHTML=MODULES.map(([id,ic,t],i)=>`${i===1?'<div class="nav-label">Curso</div>':''}${i===8?'<div class="nav-label">Mi aprendizaje</div>':''}<button data-page="${id}"><span>${ic}</span>${t}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(page){state.last=page;save();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));closeMenu();if(page==='home')home();else if(page==='sources')sources();else if(page==='favorites')collection('Favoritos','Guarda aquí las lecciones que quieras consultar rápidamente.',state.favorites);else if(page==='errors')collection('Mis errores','Las preguntas que falles aparecerán aquí para volver a practicarlas.',state.errors);else if(LESSONS[page])lessonPage(page);else placeholder(page);window.scrollTo({top:0,behavior:'smooth'})}
function home(){const total=Object.values(LESSONS).flatMap(x=>x.items).filter(x=>x.q).length,done=state.done.length,pct=total?Math.min(100,Math.round(done/total*100)):0;content.innerHTML=`<div class="hero"><div class="eyebrow">Minicurso · Perú</div><h1>Conduce entendiendo la norma.</h1><p>Aprendizaje práctico, trazable y progresivo. Cada regla legal se incorpora después de revisar su fuente oficial y vigencia.</p><div class="review"><i class="dot"></i> Normativa revisada por última vez: 19 de agosto de 2026</div></div><div class="grid"><div class="card progress-card"><div class="muted">Progreso verificado</div><div class="stat">${pct}%</div><div class="bar"><i style="width:${pct}%"></i></div><small class="muted">${done} preguntas dominadas</small></div><div class="card continue-card"><div class="eyebrow">Continuar</div><h2>Motocicleta primero</h2><p class="muted">Casco, velocidad y situaciones de conducción con fuentes oficiales visibles.</p><button class="btn" onclick="go('moto')">Continuar estudiando →</button></div></div><h2 style="margin-top:38px">Explorar módulos</h2><div class="modules">${MODULES.slice(1,8).map(([id,ic,t])=>`<div class="module" onclick="go('${id}')"><div class="emoji">${ic}</div><h3>${t}</h3><p>${id==='moto'?'Prioridad inicial':id==='auto'?'Preparado para ampliar':'Aprendizaje por bloques'}</p><span class="tag">${LESSONS[id]?.items?.length||0} lecciones</span></div>`).join('')}</div>`}
function lessonPage(key){let m=LESSONS[key];if(key==='quiz'){const qs=Object.values(LESSONS).flatMap(x=>x.items).filter(x=>x.q);m={...m,items:qs}}content.innerHTML=`<button class="back" onclick="go('home')">← Inicio</button><div class="lesson-head"><div><div class="eyebrow">Módulo</div><h1>${m.title}</h1><p class="muted">${m.intro}</p></div></div>${m.items.length?m.items.map(renderItem).join(''):`<div class="card empty">Las evaluaciones aparecerán aquí a medida que se incorporen lecciones verificadas.</div>`}`;bindQuiz()}
function renderItem(x){const fav=state.favorites.includes(x.id);return `<article class="card legal-card" id="${x.id}"><div style="display:flex;justify-content:space-between;gap:12px"><div><span class="badge">${x.kind}</span><h3 style="margin-top:10px">${x.title}</h3></div><button class="iconbtn fav" data-fav="${x.id}" title="Favorito">${fav?'★':'☆'}</button></div><p>${x.body}</p>${x.practice?`<div class="callout practice"><b>En la práctica</b>${x.practice}</div>`:''}${x.warning?`<div class="callout warn"><b>Cuidado con esto</b>${x.warning}</div>`:''}<a class="source-link" href="${SOURCES[x.source].url}" target="_blank" rel="noopener">Ver fuente oficial ↗</a>${x.q?renderQuiz(x):''}</article>`}
function renderQuiz(x){return `<div class="quiz" data-q="${x.id}"><b>Pregunta rápida</b><p>${x.q.text}</p>${x.q.opts.map((o,i)=>`<button class="option" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<div class="feedback"></div></div>`}
function bindQuiz(){document.querySelectorAll('.fav').forEach(b=>b.onclick=()=>{const id=b.dataset.fav,i=state.favorites.indexOf(id);i>=0?state.favorites.splice(i,1):state.favorites.push(id);save();b.textContent=i>=0?'☆':'★'});document.querySelectorAll('.quiz').forEach(q=>q.querySelectorAll('.option').forEach(o=>o.onclick=()=>{const item=Object.values(LESSONS).flatMap(x=>x.items).find(x=>x.id===q.dataset.q),idx=+o.dataset.i,ok=idx===item.q.answer;q.querySelectorAll('.option').forEach(x=>x.disabled=true);o.classList.add(ok?'correct':'wrong');if(!ok)q.querySelectorAll('.option')[item.q.answer].classList.add('correct');const f=q.querySelector('.feedback');f.style.display='block';f.innerHTML=`<b>${ok?'Correcto':'Aún no'}</b><br>${item.q.why}<br><a class="source-link" href="${SOURCES[item.source].url}" target="_blank">Comprobar fuente ↗</a>`;if(ok&&!state.done.includes(item.id))state.done.push(item.id);if(!ok&&!state.errors.includes(item.id))state.errors.push(item.id);if(ok){state.errors=state.errors.filter(x=>x!==item.id)}save()}))}
function sources(){content.innerHTML=`<div class="eyebrow">Trazabilidad</div><h1 style="font-size:38px">Fuentes oficiales</h1><p class="muted">Registro central de documentos usados en esta primera versión. Se priorizan MTC y gob.pe.</p><div class="card" style="margin-top:25px">${Object.values(SOURCES).map(s=>`<div class="source-item"><span class="badge">Fuente oficial</span><h3>${s.norm}</h3><div>${s.title}</div><small class="muted">${s.entity} · consulta: 19/08/2026</small><br><a href="${s.url}" target="_blank" rel="noopener">Abrir fuente oficial ↗</a></div>`).join('')}</div><div class="callout info"><b>Criterio editorial</b>Fuente oficial → vigencia → verificación → explicación → ejemplo → evaluación. Si un dato no alcanza ese estándar, se marca como pendiente.</div>`}
function collection(title,desc,ids){const items=Object.values(LESSONS).flatMap(x=>x.items).filter(x=>ids.includes(x.id));content.innerHTML=`<div class="eyebrow">Mi aprendizaje</div><h1 style="font-size:38px">${title}</h1><p class="muted">${desc}</p>${items.length?items.map(renderItem).join(''):`<div class="card empty">Todavía no hay elementos aquí.</div>`}`;bindQuiz()}
function placeholder(page){const t=MODULES.find(x=>x[0]===page)?.[2]||'Módulo';content.innerHTML=`<div class="eyebrow">Próxima etapa</div><h1>${t}</h1><div class="card"><div class="callout pending"><b>Información pendiente de verificación en fuente oficial</b>Este módulo se ampliará sin completar vacíos mediante suposiciones.</div></div>`}
function closeMenu(){sidebar.classList.remove('open');overlay.classList.remove('show')}menuBtn.onclick=()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show')};overlay.onclick=closeMenu;
let theme=localStorage.getItem('rutaTheme')||'system';document.documentElement.dataset.theme=theme;themeBtn.onclick=()=>{theme=theme==='system'?'light':theme==='light'?'dark':'system';document.documentElement.dataset.theme=theme;localStorage.setItem('rutaTheme',theme);themeBtn.textContent=theme==='light'?'☀':theme==='dark'?'☾':'◐'};
search.oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const hits=Object.entries(LESSONS).flatMap(([k,m])=>m.items.map(i=>({k,...i}))).filter(i=>(i.title+' '+i.body).toLowerCase().includes(q));content.innerHTML=`<div class="eyebrow">Búsqueda</div><h1>Resultados</h1><p class="muted">${hits.length} coincidencia${hits.length===1?'':'s'} para “${e.target.value.replace(/[<>]/g,'')}”</p>${hits.length?hits.map(renderItem).join(''):'<div class="card empty">No encontré contenido verificado con ese término.</div>'}`;bindQuiz()};
nav();go('home');
</script></body></html>
